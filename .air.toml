# --- core ---
root     = "."         # project root
tmp_dir  = "tmp"       # where the compiled binary lives
poll     = false       # fsnotify by default; set true inside networked FS

# --- env vars injected before every build/run ---
[env]
APP_ENV = "dev"
PORT    = "8080"

# --- build phase -----------------------------------------------------------
[build]
cmd           = "go build -o ./tmp/app ./cmd/watcher/main.go"  # fast; no go run
bin           = "tmp/app"      # path Air will execute
delay         = 3000              # debounce in ms
include_ext   = ["go", "tmpl", "html", "env", "yaml"]
exclude_dir   = ["tmp", "vendor", ".git", "docs"]
exclude_regex = ["_test.go"]      # don’t rebuild on unit-test edits
stop_on_error = true              # avoid infinite rebuild loop
log           = "tmp/build.log"   # collects compiler errors

# --- run phase -------------------------------------------------------------
[run]
cmd            = "./tmp/app"
grace          = 1000             # ms before SIGKILL
restart_on_exit = true            # auto-restart if your binary quits

# --- pretty logs (optional) ------------------------------------------------
[color]
main    = "yellow"
watcher = "cyan"
build   = "green"
runner  = "magenta"
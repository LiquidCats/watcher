chains:
  - chain: ethereum
    iso: eth
    type: evm
    driver: rpc
    workers:
      txid_worker_count: 0
      block_transactions_worker_count: 5
    scan:
      depth: 32
      interval: 1s
    persist:
      capacity: 32
      duration: 30s
    topics:
      transactions: eth-transactions
      blocks: eth-blocks
    rpc:
      node_url: http://eth:8545

  - chain: bitcoin
    iso: btc
    type: utxo
    driver: rpc
    workers:
      txid_worker_count: 0
      block_transactions_worker_count: 5
    scan:
      depth: 6
      interval: 10s
    persist:
      capacity: 10
      duration: 30s
    topics:
      transactions: btc-transactions
      blocks: btc-blocks
    rpc:
      node_url: http://btc:password@btc:8332